<!DOCTYPE html>
<html lang="zh-CN" data-zcode-design>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>角色详情 · 重设计原型（角色与数据范围）</title>
<style>
/* ═══ token：与 业务分析与设计准备/src/index.css 的 @theme（teal 默认主题）逐值对齐 ═══ */
:root {
  --color-brand:#176B5B; --color-brand-hover:#0f5044; --color-brand-subtle:#E8F4F1; --color-brand-on:#ffffff;
  --color-success-fg:#248A5A; --color-success-bg:#E6F5ED; --color-success-strong:#166534;
  --color-warning-fg:#C77A16; --color-warning-bg:#FEF3E2;
  --color-danger-fg:#C73A3A; --color-danger-bg:#FEECEC;
  --color-info-fg:#2F6BCE; --color-info-bg:#EBF2FE;
  --color-neutral-fg:#374151; --color-neutral-bg:#F3F4F6; --color-muted-fg:#6B7280;
  --color-canvas:#F5F7F8; --color-surface:#FFFFFF;
  --color-border:#E5E7EB; --color-border-strong:#D1D5DB; --color-table-stripe:#F9FAFB;
  --color-sidebar:#111827; --color-sidebar-hover:#1c2b3a; --color-sidebar-active:#17342b;
  --color-sidebar-text:#D1D5DB; --color-sidebar-muted:#6B7280; --color-sidebar-divider:#1F2937;
  --color-sidebar-elev:#1F2937; --color-sidebar-accent:#4ADE80;
  --color-text-1:#1F2937; --color-text-2:#667085; --color-text-3:#9CA3AF;
  --color-button-secondary:#F3F4F6; --color-button-secondary-hover:#E5E7EB;
  --color-button-ghost-hover:#F3F4F6; --color-button-outline-hover:#F9FAFB;
  --color-button-danger:#C73A3A; --color-button-danger-hover:#A82D2D;

  --font-sans:-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', Arial, sans-serif;
  --font-mono:'SFMono-Regular', Consolas, 'Liberation Mono', monospace;

  --fs-12:12px; --fs-13:13px; --fs-14:14px; --fs-16:16px; --fs-20:20px;
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:12px; --radius-full:9999px;
  --btn-h-sm:28px; --btn-h-md:32px; --btn-x-sm:10px; --btn-x-md:14px;

  --shadow-sm:0 1px 3px 0 rgba(0,0,0,0.08), 0 1px 2px -1px rgba(0,0,0,0.06);
  --shadow-lg:0 8px 24px 0 rgba(0,0,0,0.12), 0 4px 8px -4px rgba(0,0,0,0.08);
  --shadow-up:0 -6px 20px 0 rgba(0,0,0,0.08);
  --shadow-xl:0 16px 40px 0 rgba(0,0,0,0.16);
  --overlay:rgba(0,0,0,0.35);

  /* 可调参数 */
  --side-w:240px; --topbar-h:52px; --proto-h:44px; --page-x:24px;
  --tree-name-w:250px; --motion:150ms; --app-min-w:1024px;
}

*, *::before, *::after { box-sizing:border-box; }
html, body { height:100%; margin:0; }
body {
  font-family:var(--font-sans); font-size:var(--fs-14); line-height:1.5715;
  color:var(--color-text-1); background:var(--color-canvas); overflow:auto;
  display:flex; flex-direction:column;
  -webkit-font-smoothing:antialiased;
}
h1, h2, h3, h4, p { margin:0; }
ul { margin:0; padding:0; list-style:none; }
button, input, select, textarea { font-family:inherit; }
:focus-visible { outline:2px solid var(--color-brand); outline-offset:2px; }
.mono { font-family:var(--font-mono); font-feature-settings:'tnum'; }
.ic { flex:none; display:block; }

/* ═══ 原型预览条（非产品界面）：切换演示角色与租户、打开设计说明 ═══ */
.proto-bar {
  height:var(--proto-h); display:flex; align-items:center; gap:10px; padding:0 24px;
  background:var(--color-sidebar); color:var(--color-sidebar-text); font-size:var(--fs-12);
  border-bottom:1px solid var(--color-sidebar-divider); flex:none; flex-wrap:wrap; row-gap:6px;
}
.proto-label { display:inline-flex; align-items:center; gap:6px; font-weight:600; white-space:nowrap; color:var(--color-sidebar-text); }
.proto-label .ic { color:var(--color-sidebar-accent); }
.proto-sep { width:1px; height:16px; background:var(--color-sidebar-elev); margin:0 2px; }
.pchip {
  appearance:none; height:26px; padding:0 10px; border-radius:var(--radius-md);
  border:1px solid var(--color-sidebar-elev); background:transparent; color:var(--color-sidebar-text);
  font-size:var(--fs-12); cursor:pointer; white-space:nowrap; display:inline-flex; align-items:center; gap:6px;
  transition:background var(--motion) ease, border-color var(--motion) ease;
}
.pchip:hover { background:var(--color-sidebar-hover); }
.pchip[aria-pressed="true"] { background:var(--color-sidebar-active); border-color:var(--color-sidebar-accent); color:var(--color-sidebar-accent); font-weight:600; }
.pchip .pc-kind { font-size:var(--fs-12); color:var(--color-sidebar-text); font-weight:400; }
.pchip[aria-pressed="true"] .pc-kind { color:var(--color-sidebar-text); }
.proto-end { margin-left:auto; display:flex; align-items:center; gap:8px; }
.pbtn {
  appearance:none; height:26px; padding:0 10px; border-radius:var(--radius-md); cursor:pointer;
  border:1px solid var(--color-sidebar-elev); background:var(--color-sidebar-hover); color:var(--color-sidebar-text);
  font-size:var(--fs-12); display:inline-flex; align-items:center; gap:6px;
}
.pbtn:hover { background:var(--color-sidebar-divider); }

/* ═══ 应用外壳（仅作上下文，不可操作） ═══ */
.app { display:flex; flex:1 1 auto; min-height:0; min-width:var(--app-min-w); }
.side { width:var(--side-w); flex:none; display:flex; flex-direction:column; background:var(--color-sidebar); color:var(--color-sidebar-text); position:relative; }
.brand { height:68px; flex:none; display:flex; align-items:center; gap:10px; padding:0 16px; }
.brand img { width:32px; height:32px; border-radius:8px; display:block; }
.brand b { display:block; font-size:var(--fs-16); font-weight:600; color:var(--color-sidebar-text); line-height:1.25; }
.brand span { display:block; font-size:var(--fs-12); color:var(--color-sidebar-accent); line-height:1.3; }
.nav { flex:1; min-height:0; overflow:hidden; padding:8px; }
.nav-item {
  width:100%; display:flex; align-items:center; gap:8px; text-align:left; border:0; background:transparent;
  color:var(--color-sidebar-text); font-size:var(--fs-13); border-radius:var(--radius-md); cursor:default;
}
.nav-group { height:36px; padding:8px 12px; color:var(--color-text-3); }
.nav-group .ic-chevron { margin-left:auto; }
.nav-child { height:27px; padding:7px 12px; margin-left:14px; width:calc(100% - 14px); }
.nav-child.is-active { background:var(--color-sidebar-active); color:var(--color-sidebar-accent); font-weight:600; box-shadow:inset 3px 0 0 var(--color-sidebar-accent); }
.nav-badge { margin-left:auto; min-width:18px; height:18px; padding:0 5px; border-radius:var(--radius-full); background:var(--color-button-danger); color:var(--color-brand-on); font-size:var(--fs-12); font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
.side-foot { flex:none; padding:12px; font-size:var(--fs-12); color:var(--color-text-3); }
.side-foot span { display:flex; align-items:center; gap:8px; height:32px; padding:0 10px; border-radius:var(--radius-md); background:var(--color-sidebar-active); }
.side-foot i { width:6px; height:6px; border-radius:50%; background:var(--color-sidebar-accent); }
.side-toggle { position:absolute; right:-12px; top:50%; width:24px; height:24px; margin-top:-12px; border:0; border-radius:50%; background:var(--color-sidebar-elev); color:var(--color-sidebar-text); display:grid; place-items:center; }
.main { flex:1; min-width:0; display:flex; flex-direction:column; }
.topbar { height:var(--topbar-h); flex:none; display:flex; align-items:center; gap:10px; padding:0 20px; background:var(--color-surface); border-bottom:1px solid var(--color-border); }
.crumbs { display:flex; align-items:center; gap:6px; font-size:var(--fs-14); color:var(--color-text-2); white-space:nowrap; }
.crumbs b { font-weight:500; color:var(--color-text-1); }
.crumbs .ic { color:var(--color-muted-fg); }
.guide-pill { display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; margin-left:6px; border-radius:var(--radius-md); border:1px solid var(--color-border); background:var(--color-brand-subtle); color:var(--color-brand); font-size:var(--fs-12); font-weight:600; }
.guide-pill em { font-style:normal; padding:0 5px; border-radius:var(--radius-full); background:var(--color-brand-subtle); }
.topbar-end { margin-left:auto; display:flex; align-items:center; gap:8px; }
.gsearch { display:flex; align-items:center; gap:8px; width:214px; height:34px; padding:0 10px; border:1px solid var(--color-border); border-radius:var(--radius-lg); color:var(--color-muted-fg); font-size:var(--fs-13); }
.gsearch .keys { margin-left:auto; padding:0 5px; border:1px solid var(--color-border); border-radius:var(--radius-sm); font-size:var(--fs-12); }
.tbtn { display:inline-flex; align-items:center; gap:6px; height:34px; padding:0 10px; border:1px solid var(--color-border); border-radius:var(--radius-lg); background:var(--color-surface); color:var(--color-text-1); font-size:var(--fs-13); }
.tbtn .ic { color:var(--color-text-2); }
.tbtn-ico { width:34px; justify-content:center; position:relative; }
.tbtn-ico .dot { position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; border-radius:var(--radius-full); background:var(--color-button-danger); color:var(--color-brand-on); font-size:var(--fs-12); font-weight:600; display:grid; place-items:center; border:2px solid var(--color-surface); }
.userchip { display:flex; align-items:center; gap:8px; height:46px; padding:4px 8px 4px 4px; border:1px solid var(--color-border); border-radius:var(--radius-xl); margin-left:4px; }
.userchip .ava { width:30px; height:30px; border-radius:8px; background:var(--color-brand); color:var(--color-brand-on); display:grid; place-items:center; font-size:var(--fs-13); font-weight:600; }
.userchip .u1 { font-size:var(--fs-13); font-weight:600; line-height:1.25; }
.userchip .u1 span { font-weight:400; color:var(--color-muted-fg); margin-left:4px; }
.userchip .u2 { font-size:var(--fs-12); color:var(--color-text-2); line-height:1.3; white-space:nowrap; }
.userchip .ic { color:var(--color-text-2); }
.view { flex:1; min-height:0; display:flex; flex-direction:column; }

/* ═══ 页头与页签（对齐 PageHeader 组件） ═══ */
.pagehead { flex:none; background:var(--color-surface); border-bottom:1px solid var(--color-border); padding:16px var(--page-x) 0; }
.pagehead-top { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; }
.pagehead-main { min-width:0; flex:1 1 auto; }
.pagehead h1 { display:flex; align-items:center; flex-wrap:wrap; gap:8px; font-size:var(--fs-20); font-weight:600; line-height:26px; color:var(--color-text-1); }
.pagehead-desc { margin-top:6px; font-size:var(--fs-13); color:var(--color-text-2); line-height:1.6; max-width:820px; }
.pagehead-meta { margin-top:6px; display:flex; flex-wrap:wrap; align-items:center; gap:4px 14px; font-size:var(--fs-12); color:var(--color-text-2); }
.pagehead-meta b { font-weight:500; color:var(--color-text-1); }
.pagehead-actions { display:flex; align-items:center; gap:8px; flex:none; flex-wrap:wrap; justify-content:flex-end; padding-top:2px; }
.tabs { display:flex; gap:4px; margin-top:12px; }
.tab {
  appearance:none; border:0; background:none; padding:8px 12px 10px; margin-bottom:-1px; cursor:pointer;
  display:inline-flex; align-items:center; gap:6px; font-size:var(--fs-14); color:var(--color-text-2);
  border-bottom:2px solid transparent; transition:color var(--motion) ease, border-color var(--motion) ease;
}
.tab:hover { color:var(--color-text-1); }
.tab[aria-selected="true"] { color:var(--color-brand); font-weight:600; border-bottom-color:var(--color-brand); }
.tab-count { min-width:20px; padding:0 6px; height:18px; border-radius:var(--radius-full); background:var(--color-neutral-bg); color:var(--color-neutral-fg); font-size:var(--fs-12); font-weight:600; display:inline-flex; align-items:center; justify-content:center; }
.tab[aria-selected="true"] .tab-count { background:var(--color-brand-subtle); color:var(--color-brand); }
.tab-dot { width:6px; height:6px; border-radius:50%; background:var(--color-warning-fg); }

/* ═══ 内容区与卡片 ═══ */
.content { flex:1; min-height:0; overflow:auto; position:relative; }
.content-body { padding:16px var(--page-x) 24px; display:flex; flex-direction:column; gap:12px; }
.content-body.has-bar { padding-bottom:0; }
.card { background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg); }
.card > :first-child { border-top-left-radius:var(--radius-lg); border-top-right-radius:var(--radius-lg); }
.card > :last-child { border-bottom-left-radius:var(--radius-lg); border-bottom-right-radius:var(--radius-lg); }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:8px 16px; flex-wrap:wrap; padding:12px 16px; border-bottom:1px solid var(--color-neutral-bg); }
.card-title { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0; }
.card-title h2 { font-size:var(--fs-14); font-weight:600; color:var(--color-text-1); }
.card-sub { font-size:var(--fs-12); color:var(--color-text-2); }
.card-tools { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }

/* ═══ 按钮（对齐 Button.tsx：sm 28 / md 32，6px 圆角） ═══ */
.btn {
  appearance:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; height:var(--btn-h-md); padding:0 var(--btn-x-md);
  border-radius:var(--radius-md); border:1px solid transparent; font-size:var(--fs-13); font-weight:500; line-height:1; white-space:nowrap; cursor:pointer;
  transition:background var(--motion) ease, border-color var(--motion) ease;
}
.btn:disabled { cursor:not-allowed; opacity:.5; }
.btn-sm { height:var(--btn-h-sm); padding:0 var(--btn-x-sm); font-size:var(--fs-12); }
.btn-primary { background:var(--color-brand); color:var(--color-brand-on); border-color:var(--color-brand); }
.btn-primary:hover:not(:disabled) { background:var(--color-brand-hover); border-color:var(--color-brand-hover); }
.btn-outline { background:transparent; color:var(--color-neutral-fg); border-color:var(--color-border-strong); }
.btn-outline:hover:not(:disabled) { background:var(--color-button-outline-hover); }
.btn-ghost { background:transparent; color:var(--color-neutral-fg); border-color:transparent; }
.btn-ghost:hover:not(:disabled) { background:var(--color-button-ghost-hover); }
.btn-secondary { background:var(--color-button-secondary); color:var(--color-neutral-fg); border-color:var(--color-border); }
.btn-secondary:hover:not(:disabled) { background:var(--color-button-secondary-hover); }
.btn-soft { background:var(--color-surface); color:var(--color-neutral-fg); border-color:var(--color-border-strong); }
.btn-soft:hover:not(:disabled) { background:var(--color-button-secondary); }
.btn-danger { background:var(--color-button-danger); color:var(--color-brand-on); border-color:var(--color-button-danger); }
.btn-danger:hover:not(:disabled) { background:var(--color-button-danger-hover); border-color:var(--color-button-danger-hover); }
.btn-quiet-danger { background:transparent; color:var(--color-button-danger-hover); border-color:transparent; }
.btn-quiet-danger:hover:not(:disabled) { background:var(--color-danger-bg); }
.icon-btn { appearance:none; width:28px; height:28px; display:grid; place-items:center; border:0; border-radius:var(--radius-md); background:transparent; color:var(--color-text-2); cursor:pointer; }
.icon-btn:hover { background:var(--color-button-ghost-hover); color:var(--color-text-1); }

/* ═══ 状态胶囊 / 标签 ═══ */
.pill { display:inline-flex; align-items:center; gap:4px; height:22px; padding:0 8px; border-radius:var(--radius-full); font-size:var(--fs-12); font-weight:500; white-space:nowrap; line-height:1; }
.pill-success { background:var(--color-success-bg); color:var(--color-success-strong); }
.pill-neutral { background:var(--color-neutral-bg); color:var(--color-neutral-fg); }
.pill-muted { background:var(--color-neutral-bg); color:var(--color-text-2); }
.pill-danger { background:var(--color-danger-bg); color:var(--color-button-danger-hover); }
.pill-warning { background:var(--color-warning-bg); color:var(--color-button-danger-hover); }
.pill-brand { background:var(--color-brand-subtle); color:var(--color-brand); }
.pill-info { background:var(--color-info-bg); color:var(--color-info-fg); }
.tag { display:inline-flex; align-items:center; gap:4px; height:24px; padding:0 8px; border-radius:var(--radius-sm); background:var(--color-neutral-bg); color:var(--color-neutral-fg); font-size:var(--fs-12); font-weight:500; white-space:nowrap; }
.tag-risk { background:var(--color-danger-bg); color:var(--color-button-danger-hover); }
.tag-muted { background:transparent; color:var(--color-text-2); border:1px solid var(--color-border); }
.risk-txt { display:inline-flex; align-items:center; gap:3px; color:var(--color-button-danger-hover); font-weight:600; }

/* ═══ 输入控件 ═══ */
.input, .select {
  height:32px; padding:0 10px; border:1px solid var(--color-border); border-radius:var(--radius-md); background:var(--color-surface);
  font-size:var(--fs-13); color:var(--color-text-1); min-width:0;
}
.input::placeholder { color:var(--color-muted-fg); }
.input:hover, .select:hover { border-color:var(--color-border-strong); }
.input:focus-visible, .select:focus-visible { border-color:var(--color-brand); outline-offset:0; box-shadow:0 0 0 3px var(--color-brand-subtle); }
.input[aria-invalid="true"] { border-color:var(--color-button-danger); }
.select { appearance:none; padding-right:28px; cursor:pointer; color:var(--color-text-2); background-image:linear-gradient(45deg, transparent 50%, var(--color-text-2) 50%), linear-gradient(135deg, var(--color-text-2) 50%, transparent 50%); background-position:calc(100% - 15px) 13px, calc(100% - 10px) 13px; background-size:5px 5px, 5px 5px; background-repeat:no-repeat; }
.select[data-active="true"] { color:var(--color-text-1); font-weight:500; }
.search { position:relative; display:flex; align-items:center; }
.search .ic { position:absolute; left:10px; color:var(--color-muted-fg); pointer-events:none; }
.search .input { padding-left:30px; padding-right:28px; width:100%; }
.search .clear { position:absolute; right:4px; }
textarea.input { height:auto; padding:8px 10px; resize:vertical; line-height:1.6; }
.field { display:flex; flex-direction:column; gap:6px; min-width:0; }
.field > label, .field-label { font-size:var(--fs-12); font-weight:500; color:var(--color-text-2); }
.req { color:var(--color-button-danger-hover); margin-left:2px; }
.hint { font-size:var(--fs-12); color:var(--color-text-2); }
.err { font-size:var(--fs-12); color:var(--color-button-danger-hover); display:flex; align-items:center; gap:4px; }

/* 复选框（16px；未选边框取 muted-fg，对白底对比 4.8:1） */
.cb { appearance:none; width:16px; height:16px; margin:0; flex:none; border:1px solid var(--color-muted-fg); border-radius:var(--radius-sm); background:var(--color-surface); cursor:pointer; display:inline-grid; place-items:center; transition:background var(--motion) ease, border-color var(--motion) ease; }
.cb::before { content:""; width:9px; height:5px; border:2px solid var(--color-brand-on); border-top:0; border-right:0; transform:rotate(-45deg) scale(0); margin-top:-2px; transition:transform var(--motion) ease; }
.cb:checked { background:var(--color-brand); border-color:var(--color-brand); }
.cb:checked::before { transform:rotate(-45deg) scale(1); }
.cb:indeterminate { background:var(--color-brand-subtle); border-color:var(--color-brand); }
.cb:indeterminate::before { width:8px; height:0; border:0; border-top:2px solid var(--color-brand); transform:none; margin-top:0; }
.cb:disabled { cursor:not-allowed; opacity:.45; }
.cb:indeterminate:disabled { opacity:1; border-color:var(--color-text-3); background:var(--color-neutral-bg); }
.cb:indeterminate:disabled::before { border-top-color:var(--color-text-2); }

/* ═══ 权限树：分组 → 页面 → 操作 ═══ */
.group-head { position:sticky; top:0; z-index:1; display:grid; grid-template-columns:16px 1fr auto; align-items:center; gap:10px; padding:8px 16px; background:var(--color-table-stripe); border-top:1px solid var(--color-border); border-bottom:1px solid var(--color-border); }
.group-head:first-child { border-top:0; }
.group-name { display:flex; align-items:center; gap:8px; font-size:var(--fs-13); font-weight:600; color:var(--color-text-1); }
.group-name .ic { color:var(--color-text-2); }
.group-count { font-size:var(--fs-12); color:var(--color-text-2); white-space:nowrap; }
.group-count b { color:var(--color-text-1); font-weight:600; }
.row { display:grid; grid-template-columns:16px minmax(170px, var(--tree-name-w)) minmax(0, 1fr); align-items:start; gap:6px 12px; padding:10px 16px 10px 44px; border-bottom:1px solid var(--color-neutral-bg); }
.row:last-child { border-bottom:0; }
.row-cb { height:24px; display:flex; align-items:center; }
.row-name { font-size:var(--fs-13); font-weight:500; line-height:24px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.row-acts { display:flex; flex-wrap:wrap; align-items:center; gap:6px; min-height:24px; }
.row-void { font-size:var(--fs-12); color:var(--color-text-2); line-height:24px; }
.act {
  appearance:none; display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 9px; border-radius:var(--radius-md);
  border:1px solid var(--color-border-strong); background:var(--color-surface); color:var(--color-text-2); font-size:var(--fs-12); font-weight:500; line-height:1; cursor:pointer; white-space:nowrap;
  transition:background var(--motion) ease, border-color var(--motion) ease, color var(--motion) ease;
}
.act:hover { border-color:var(--color-muted-fg); color:var(--color-text-1); }
.act .ic { width:13px; height:13px; }
.act .on-check { display:none; }
.act[aria-pressed="true"] { background:var(--color-brand-subtle); border-color:var(--color-brand); color:var(--color-brand); }
.act[aria-pressed="true"] .on-check { display:block; }
.act[aria-pressed="true"] .off-risk { display:none; }
.act-risk[aria-pressed="true"] { background:var(--color-danger-bg); border-color:var(--color-danger-fg); color:var(--color-button-danger-hover); }
.act-risk[aria-pressed="true"] .on-check { color:var(--color-danger-fg); }
.off-risk { color:var(--color-danger-fg); }
.legend { display:flex; align-items:center; gap:14px; flex-wrap:wrap; padding:8px 16px; font-size:var(--fs-12); color:var(--color-text-2); border-bottom:1px solid var(--color-neutral-bg); background:var(--color-surface); }
.legend span { display:inline-flex; align-items:center; gap:5px; }
.mini { display:inline-flex; align-items:center; gap:4px; height:20px; padding:0 7px; border-radius:var(--radius-md); border:1px solid var(--color-border-strong); background:var(--color-surface); color:var(--color-text-2); }
.mini-on { background:var(--color-brand-subtle); border-color:var(--color-brand); color:var(--color-brand); }
.mini-risk { background:var(--color-danger-bg); border-color:var(--color-danger-fg); color:var(--color-button-danger-hover); }
.denied { border-top:1px solid var(--color-border); }
.denied-summary { display:flex; align-items:center; gap:8px; width:100%; padding:10px 16px; border:0; background:var(--color-surface); font-size:var(--fs-13); color:var(--color-text-2); cursor:pointer; text-align:left; }
.denied-summary:hover { background:var(--color-table-stripe); }
.denied-list { padding:4px 16px 12px 44px; display:flex; flex-wrap:wrap; gap:6px; }

/* 敏感字段 */
.sfield { display:grid; grid-template-columns:minmax(190px, 300px) minmax(0, 1fr) auto; align-items:center; gap:4px 24px; padding:12px 16px; border-bottom:1px solid var(--color-neutral-bg); }
.sfield:last-child { border-bottom:0; }
.sfield-name { font-size:var(--fs-13); font-weight:500; }
.sfield-desc { font-size:var(--fs-12); color:var(--color-text-2); }
.sfield-view { font-size:var(--fs-13); color:var(--color-text-2); display:flex; align-items:center; gap:8px; min-width:0; }
.sfield-view code { font-family:var(--font-mono); font-size:var(--fs-13); color:var(--color-text-1); background:var(--color-neutral-bg); border-radius:var(--radius-sm); padding:1px 6px; white-space:nowrap; }
.seg { display:inline-flex; border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; }
.seg button { appearance:none; height:28px; padding:0 12px; border:0; border-left:1px solid var(--color-border); background:var(--color-surface); color:var(--color-neutral-fg); font-size:var(--fs-12); cursor:pointer; }
.seg button:first-child { border-left:0; }
.seg button[aria-pressed="true"], .seg button[aria-checked="true"] { background:var(--color-brand-subtle); color:var(--color-brand); font-weight:600; }
.seg button:disabled { cursor:not-allowed; }

/* ═══ 表格（成员 / 列表） ═══ */
.tbl { width:100%; border-collapse:collapse; }
.tbl th { padding:10px 16px; text-align:left; font-size:var(--fs-12); font-weight:600; color:var(--color-muted-fg); background:var(--color-table-stripe); border-bottom:1px solid var(--color-border); white-space:nowrap; }
.tbl td { padding:10px 16px; font-size:var(--fs-13); color:var(--color-text-1); border-bottom:1px solid var(--color-neutral-bg); vertical-align:middle; }
.tbl tr:last-child td { border-bottom:0; }
.cell-person b { font-weight:600; }
.cell-person span { margin-left:8px; font-size:var(--fs-12); color:var(--color-text-2); }
.cell-sub { font-size:var(--fs-12); color:var(--color-text-2); margin-top:1px; }
.cell-ops { display:flex; align-items:center; gap:4px; white-space:nowrap; justify-content:flex-end; }
.tbl .num { text-align:right; }
.empty { padding:36px 16px; text-align:center; }
.empty h3 { font-size:var(--fs-14); font-weight:600; margin-top:10px; }
.empty p { margin:6px auto 14px; max-width:460px; font-size:var(--fs-13); color:var(--color-text-2); }
.empty .ic { margin:0 auto; color:var(--color-muted-fg); }

/* ═══ 提示条 / 更改栏 ═══ */
.note { display:flex; align-items:flex-start; gap:8px; padding:9px 12px; border-radius:var(--radius-lg); font-size:var(--fs-12); line-height:1.7; }
.note .ic { margin-top:2px; }
.note-neutral { background:var(--color-table-stripe); border:1px solid var(--color-border); color:var(--color-text-1); }
.note-neutral .ic { color:var(--color-text-2); }
.note-brand { background:var(--color-brand-subtle); border:1px solid var(--color-brand); color:var(--color-text-1); }
.note-brand .ic { color:var(--color-brand); }
.note-warn { background:var(--color-warning-bg); border:1px solid var(--color-warning-fg); color:var(--color-text-1); }
.note-warn .ic { color:var(--color-button-danger-hover); }
.changebar { position:sticky; bottom:0; z-index:6; display:flex; align-items:center; gap:8px 16px; flex-wrap:wrap; padding:10px var(--page-x); background:var(--color-surface); border-top:1px solid var(--color-border); box-shadow:var(--shadow-up); }
.changebar-main { display:flex; align-items:center; gap:10px; min-width:0; flex-wrap:wrap; }
.changebar .dot { width:8px; height:8px; border-radius:50%; background:var(--color-warning-fg); flex:none; }
.changebar b { font-size:var(--fs-13); font-weight:600; }
.changebar-sum { font-size:var(--fs-12); color:var(--color-text-2); }
.changebar-ops { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.changes { position:sticky; bottom:52px; z-index:6; background:var(--color-surface); border-top:1px solid var(--color-border); box-shadow:var(--shadow-up); padding:12px var(--page-x) 4px; max-height:46vh; overflow:auto; }
.changes h3 { font-size:var(--fs-13); font-weight:600; margin-bottom:6px; }
.changes li { display:flex; gap:8px; align-items:flex-start; padding:6px 0; font-size:var(--fs-13); border-bottom:1px solid var(--color-neutral-bg); }
.changes li:last-child { border-bottom:0; }
.changes li .ic { margin-top:3px; }
.ch-add .ic { color:var(--color-brand); }
.ch-del .ic { color:var(--color-button-danger-hover); }
.ch-del s { color:var(--color-text-2); }

/* ═══ 弹窗 ═══ */
.layer { position:fixed; z-index:1000; inset:var(--proto-h) 0 0 0; display:flex; align-items:center; justify-content:center; padding:24px; background:var(--overlay); animation:fade var(--motion) ease; }
.dialog { width:100%; background:var(--color-surface); border-radius:var(--radius-xl); box-shadow:var(--shadow-xl); display:flex; flex-direction:column; max-height:calc(100vh - var(--proto-h) - 48px); animation:pop var(--motion) ease; }
.dialog-sm { max-width:440px; } .dialog-md { max-width:640px; } .dialog-lg { max-width:800px; }
.dlg-head { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding:16px 20px; border-bottom:1px solid var(--color-border); flex:none; }
.dlg-head h2 { font-size:var(--fs-16); font-weight:600; line-height:1.4; }
.dlg-head p { margin-top:2px; font-size:var(--fs-12); color:var(--color-text-2); }
.dlg-body { padding:16px 20px; overflow:auto; display:flex; flex-direction:column; gap:14px; min-height:0; }
.dlg-foot { display:flex; align-items:center; gap:10px; justify-content:flex-end; padding:12px 20px; border-top:1px solid var(--color-border); flex:none; flex-wrap:wrap; }
.dlg-foot .err { margin-right:auto; }
.dlg-icon { width:40px; height:40; flex:none; display:grid; place-items:center; border-radius:var(--radius-lg); }
.dlg-icon-danger { background:var(--color-danger-bg); color:var(--color-danger-fg); }
.dlg-icon-warn { background:var(--color-warning-bg); color:var(--color-button-danger-hover); }
.dlg-lead { display:flex; gap:14px; align-items:flex-start; }
.dlg-lead h2 { margin-bottom:4px; }
.dlg-lead p { font-size:var(--fs-14); color:var(--color-text-2); line-height:1.6; }
.impact { padding:10px 12px; border-radius:var(--radius-md); font-size:var(--fs-13); line-height:1.7; background:var(--color-danger-bg); border:1px solid var(--color-danger-fg); }
.impact-warn { background:var(--color-warning-bg); border-color:var(--color-warning-fg); }
.impact b { font-weight:600; }
.impact ul { margin-top:4px; }
.impact li { display:flex; gap:6px; }
.impact li .ic { margin-top:4px; }
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px 16px; }
.form-grid .span2 { grid-column:1 / -1; }
.inline { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.inline .input { width:150px; }
.chips { display:flex; flex-wrap:wrap; gap:6px; }

/* 授予成员：勾选列表 + 已选清单 */
.picker { display:grid; grid-template-columns:minmax(0, 1.5fr) minmax(0, 1fr); border:1px solid var(--color-border); border-radius:var(--radius-lg); overflow:hidden; }
.picker-all { border-right:1px solid var(--color-border); display:flex; flex-direction:column; min-width:0; }
.picker-head { display:flex; align-items:center; gap:8px; padding:10px 12px; font-size:var(--fs-12); color:var(--color-text-2); border-bottom:1px solid var(--color-neutral-bg); flex:none; }
.picker-head b { font-size:var(--fs-13); color:var(--color-text-1); font-weight:600; }
.picker-head .right { margin-left:auto; }
.picker-tools { display:flex; gap:8px; padding:10px 12px; flex:none; }
.picker-tools .search { flex:1; }
.picker-tools .select { width:132px; flex:none; }
.plist { height:236px; overflow:auto; }
.plist li + li { border-top:1px solid var(--color-neutral-bg); }
.pitem { display:grid; grid-template-columns:16px minmax(0, 1fr) auto; align-items:center; gap:10px; padding:8px 12px; cursor:pointer; }
.pitem:hover { background:var(--color-table-stripe); }
.pitem:has(.cb:checked) { background:var(--color-brand-subtle); }
.pitem:has(.cb:disabled) { cursor:not-allowed; }
.pitem b { font-weight:600; }
.pitem .sub { font-size:var(--fs-12); color:var(--color-text-2); margin-left:6px; }
.picker-sel { display:flex; flex-direction:column; min-width:0; background:var(--color-table-stripe); }
.slist { flex:1; overflow:auto; padding:6px; display:flex; flex-direction:column; gap:4px; min-height:208px; }
.slist li { display:flex; align-items:center; gap:8px; padding:6px 6px 6px 10px; background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); font-size:var(--fs-13); }
.slist li span { font-size:var(--fs-12); color:var(--color-text-2); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slist .icon-btn { margin-left:auto; }
.slist-empty { margin:auto; text-align:center; font-size:var(--fs-12); color:var(--color-text-2); padding:16px; }
details.adv { border:1px solid var(--color-border); border-radius:var(--radius-lg); }
details.adv > summary { list-style:none; display:flex; align-items:center; gap:8px; padding:9px 12px; font-size:var(--fs-13); font-weight:500; cursor:pointer; color:var(--color-text-1); }
details.adv > summary::-webkit-details-marker { display:none; }
details.adv > summary .ic { color:var(--color-text-2); transition:transform var(--motion) ease; }
details.adv[open] > summary .ic { transform:rotate(90deg); }
details.adv > summary .hint { margin-left:auto; font-weight:400; }
details.adv .adv-body { padding:0 12px 12px 32px; display:flex; flex-direction:column; gap:6px; }
.tgl { appearance:none; display:inline-flex; align-items:center; gap:5px; height:26px; padding:0 10px; border-radius:var(--radius-md); border:1px solid var(--color-border-strong); background:var(--color-surface); color:var(--color-text-2); font-size:var(--fs-12); font-weight:500; cursor:pointer; }
.tgl[aria-pressed="true"] { background:var(--color-brand-subtle); border-color:var(--color-brand); color:var(--color-brand); }
.choice { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.choice label { display:flex; gap:10px; padding:10px 12px; border:1px solid var(--color-border); border-radius:var(--radius-lg); cursor:pointer; }
.choice label:has(input:checked) { border-color:var(--color-brand); background:var(--color-brand-subtle); }
.choice input { margin:3px 0 0; accent-color:var(--color-brand); width:15px; height:15px; flex:none; }
.choice b { display:block; font-size:var(--fs-13); font-weight:600; }
.choice span { display:block; font-size:var(--fs-12); color:var(--color-text-2); margin-top:2px; }
.scope-card { border:1px solid var(--color-border); border-radius:var(--radius-lg); padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.scope-card.is-on { border-color:var(--color-brand); }
.scope-card.is-off { opacity:.72; }
.scope-card .top { display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.scope-card .top b { font-weight:600; }
.scope-card .top .right { margin-left:auto; font-size:var(--fs-12); color:var(--color-text-2); }
.scope-line { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding-left:24px; font-size:var(--fs-12); color:var(--color-text-2); }
.scope-line b { color:var(--color-text-1); font-weight:500; }
.tgl-narrow[aria-pressed="true"] { background:var(--color-warning-bg); border-color:var(--color-warning-fg); color:var(--color-button-danger-hover); }

/* 设计说明抽屉 */
.drawer-layer { position:fixed; z-index:1200; inset:var(--proto-h) 0 0 0; background:var(--overlay); animation:fade var(--motion) ease; }
.drawer { position:absolute; top:0; right:0; bottom:0; width:min(480px, 100%); background:var(--color-surface); box-shadow:var(--shadow-xl); display:flex; flex-direction:column; animation:slide var(--motion) ease; }
.drawer-body { overflow:auto; padding:16px 20px 24px; display:flex; flex-direction:column; gap:14px; }
.drawer h3 { font-size:var(--fs-13); font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:6px; }
.drawer h3 .ic { color:var(--color-brand); }
.drawer p, .drawer li { font-size:var(--fs-13); color:var(--color-text-1); line-height:1.7; }
.drawer ol { padding-left:18px; list-style:decimal; display:flex; flex-direction:column; gap:4px; }
.drawer ul.dot { list-style:disc; padding-left:18px; display:flex; flex-direction:column; gap:4px; }
.drawer .muted { color:var(--color-text-2); }
.drawer table { width:100%; border-collapse:collapse; font-size:var(--fs-12); }
.drawer th, .drawer td { text-align:left; vertical-align:top; padding:6px 8px; border-bottom:1px solid var(--color-neutral-bg); line-height:1.6; }
.drawer th { color:var(--color-muted-fg); font-weight:600; background:var(--color-table-stripe); }

/* Toast */
.toasts { position:fixed; z-index:1300; top:calc(var(--proto-h) + 12px); right:16px; display:flex; flex-direction:column; gap:8px; width:360px; pointer-events:none; }
.toast { pointer-events:auto; display:grid; grid-template-columns:20px minmax(0,1fr) 24px; gap:10px; padding:12px 12px 12px 14px; background:var(--color-surface); border:1px solid var(--color-border); border-left:3px solid var(--color-brand); border-radius:var(--radius-lg); box-shadow:var(--shadow-lg); animation:rise var(--motion) ease; }
.toast-ok { border-left-color:var(--color-success-fg); } .toast-ok .ic { color:var(--color-success-fg); }
.toast-err { border-left-color:var(--color-danger-fg); } .toast-err .ic { color:var(--color-danger-fg); }
.toast b { display:block; font-size:var(--fs-13); font-weight:600; }
.toast p { font-size:var(--fs-12); color:var(--color-text-2); line-height:1.6; margin-top:2px; }

.sr { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
@keyframes fade { from { opacity:0; } to { opacity:1; } }
@keyframes pop { from { opacity:0; transform:scale(.97) translateY(-6px); } to { opacity:1; transform:none; } }
@keyframes slide { from { transform:translateX(24px); opacity:0; } to { transform:none; opacity:1; } }
@keyframes rise { from { opacity:0; transform:translateY(-6px); } to { opacity:1; transform:none; } }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation:none !important; transition:none !important; }
}
@media (max-width: 1280px) {
  :root { --tree-name-w:210px; }
  .picker { grid-template-columns:minmax(0, 1.35fr) minmax(0, 1fr); }
  .gsearch { width:170px; }
}
/* ═══ 补充：页面内用到的派生样式（全部引用上面的 token） ═══ */
.crumbs .cur { color: var(--color-text-1); font-weight:500; }
.card-sub b { color: var(--color-text-1); font-weight:600; }
.profile-edit { display:grid; grid-template-columns:320px minmax(0, 1fr); gap:12px; max-width:780px; }
.view-on .ic { color: var(--color-brand); }
.view-off .ic { color: var(--color-muted-fg); }
.act .off-dot { color: var(--color-muted-fg); }
.act[aria-pressed="true"] .off-dot { display:none; }
.row-off td { color: var(--color-text-2); }
.row-off .cell-person b { color: var(--color-text-2); }
.tgl .ic { display:none; }
.tgl[aria-pressed="true"] .ic { display:block; }
.tgl:disabled { cursor:not-allowed; opacity:.55; }
.toast-info { border-left-color:var(--color-brand); }
.toast-info .ic { color:var(--color-brand); }
.filterbar { display:flex; align-items:center; gap:8px; flex-wrap:wrap; padding:10px 14px; }
.segf { display:inline-flex; border:1px solid var(--color-border); border-radius:var(--radius-md); overflow:hidden; }
.segf button { appearance:none; height:28px; padding:0 12px; border:0; background:var(--color-surface); color:var(--color-neutral-fg); font-size:var(--fs-12); font-weight:500; cursor:pointer; }
.segf button:hover { background:var(--color-button-outline-hover); }
.segf button[aria-pressed="true"] { background:var(--color-brand-subtle); color:var(--color-brand); }
.list-count { margin-left:auto; }
.role-name { display:flex; align-items:center; gap:8px; min-width:0; }
.role-name .ic { color:var(--color-brand); }
.role-name b { font-weight:600; }
.role-name .cell-sub { max-width:380px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.slist-empty { list-style:none; }
.pitem span:nth-child(2) { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
@media (max-width: 1280px) { .profile-edit { grid-template-columns:260px minmax(0, 1fr); } }

/* 未保存更改栏：吸底容器必须是滚动区的直接子元素，否则 sticky 不生效 */
#bar-zone { position:sticky; bottom:0; z-index:6; }
#bar-zone:not(:empty) + * { margin-top:0; }
.changebar { box-shadow:var(--shadow-up); }
/* 单页面分组：顶层页面行 */
.row.solo { grid-template-columns:16px 18px minmax(170px, var(--tree-name-w)) minmax(0, 1fr); padding-left:16px; border-bottom:1px solid var(--color-border); }
.row.solo .row-name { font-weight:600; }
.row.solo .row-icon { height:24px; display:flex; align-items:center; color:var(--color-text-2); }
.row.solo + .group-head { border-top:0; }
.legend { border-bottom:0; }
.legend + .group-head, .legend + .row.solo { border-top:1px solid var(--color-border); }
/* 页头元信息分隔 */
.pagehead-meta { gap:0; }
.pagehead-meta > span { display:inline-flex; align-items:center; gap:4px; }
.pagehead-meta > span + span::before { content:"·"; margin:0 12px; color:var(--color-text-3); }
/* 无标题弹窗的关闭按钮 */
.dialog { position:relative; }
.dlg-x { position:absolute; top:12px; right:12px; z-index:1; }
/* 未开放折叠行：与分组标题同一层级 */
.denied-summary { padding:11px 16px; }

.sfield-top { padding:8px 16px; font-size:var(--fs-12); font-weight:600; color:var(--color-muted-fg); background:var(--color-table-stripe); border-bottom:1px solid var(--color-border); }

/* 宽表格在卡片内横向滚动，不撑破页面（设计基线：小于 1280px 允许表格横向滚动） */
.tbl-wrap { overflow-x:auto; }
/* 较窄桌面：收起顶栏里与本页无关的入口 */
@media (max-width: 1360px) {
  .gsearch, .tbtn-aux { display:none; }
}
@media (max-width: 1180px) {
  .guide-pill { display:none; }
}
@media (max-width: 1100px) {
  .userchip .u2 { display:none; }
  .userchip { height:34px; }
}
/* 原型控制条：放不下时换行（高度自适应，下方应用占剩余高度），不遮挡右侧按钮 */

function groupsFor(tenant) {
  const set = PAGES.filter(p => !p.types || p.types.includes(tenant));
  const inNav = new Set();
  const groups = NAV[tenant].map(([name, ic, ids]) => {
    const pages = ids.map(pageOf).filter(p => set.includes(p));
    ids.forEach(i => inNav.add(i));
    return { name, icon: ic, pages, other: false };

  const rest = set.filter(p => !inNav.has(p.id));
  if (rest.length) groups.push({ name: '其他页面', icon: 'Folder', pages: rest, other: true });
  return groups;
}

/* 未保存更改：相对已保存版本逐项计算 */
function changes(r) {
  const d = S.draft, T = r.tenant, out = [];
  if (!d) return out;
  if (d.name.trim() !== r.name) out.push({ kind: 'info', text: '角色名称：「' + r.name + '」→「' + (d.name.trim() || '未命名') + '」' });
  if (d.desc.trim() !== r.desc) out.push({ kind: 'info', text: '角色说明已修改' });
  const addP = [], delP = [];
  let add = 0, del = 0;
  for (const p of PAGES) {
    const b = r.perms[p.id] || [], a = d.perms[p.id] || [];
    add += a.filter(k => !b.includes(k)).length;
    del += b.filter(k => !a.includes(k)).length;
    if (!b.length && a.length) { addP.push(nameOf(p.id, T)); continue; }
    if (b.length && !a.length) { delP.push(nameOf(p.id, T)); continue; }
    const gained = a.filter(k => !b.includes(k) && k !== 'view').map(k => labelOf(p.id, k));
    const lost = b.filter(k => !a.includes(k) && k !== 'view').map(k => labelOf(p.id, k));
    if (gained.length) out.push({ kind: 'add', text: nameOf(p.id, T) + '：新增 ' + gained.join('、') });
    if (lost.length) out.push({ kind: 'del', text: nameOf(p.id, T) + '：移除 ' + lost.join('、') });
  }
  if (addP.length) out.push({ kind: 'add', text: '新增可访问页面：' + addP.join('、') });
  if (delP.length) out.push({ kind: 'del', text: '移除可访问页面：' + delP.join('、') });
  const rf = r.fields || {}, df = d.fields || {};
  const fc = FIELDS.filter(f => (df[f.key] || 'visible') !== (rf[f.key] || 'visible')).map(f => f.name + ' ' + POLICY[rf[f.key] || 'visible'] + ' → ' + POLICY[df[f.key] || 'visible']);
  if (fc.length) out.push({ kind: 'info', text: '敏感字段策略：' + fc.join('；') });
  return { list: out, add, del };
}

const pill = (cfg, extra = '') => `<span class="pill ${cfg[0]} ${extra}">${icon(cfg[1], 13)}${cfg[2]}</span>`;
const btn = (cls, act, text, extra = '') => `<button type="button" class="btn ${cls}" data-act="${act}" ${extra}>${text}</button>`;

/* ═════════════════════ 角色详情页 ═════════════════════ */
function renderDetail() {
  const r = role(), T = r.tenant, ed = canEdit(r), dirty = isDirty(r);
  const active = activeMembers(r).length;
  /* 自定义角色：页头显示草稿里的名称与说明（未保存的改名要立刻可见） */
  const shown = ed && S.draft ? { name: S.draft.name.trim() || r.name, desc: S.draft.desc, by: ACTOR, at: '' } : { name: r.name, desc: r.desc, by: r.by, at: r.at };
  const scope = T === 'pharma'
    ? '<span>数据范围 <b>按成员在「用户管理」配置</b></span>'
    : `<span>默认数据范围 <b>${ORG_SCOPE[r.id === 'provider-admin' ? 'PROVIDER' : 'DEPT_AND_CHILD']}</b></span>`;
  const note = r.kind === 'preset' && S.tab !== 'perm' ? '' : r.kind === 'preset'
    ? `<div class="note note-neutral">${icon('Lock', 14)}<span>预置角色由系统维护：权限不可修改，也不可停用或删除。你可以授予、调整或回收持有该角色的成员。</span></div>`
    : r.status === 'draft'
      ? `<div class="note note-brand">${icon('Info', 14)}<span>草稿角色尚未启用，启用后才能授予成员。配置完成后点击「保存并启用」。</span></div>`
      : r.status === 'disabled'
        ? `<div class="note note-neutral">${icon('Ban', 14)}<span>角色已停用：持有成员的权限暂不生效。保存资料不会让它重新启用；启用请在角色列表中操作。</span></div>`
        : '';
  view.innerHTML = `
    <div class="pagehead">
      <div class="pagehead-top">
        <div class="pagehead-main">
          ${S.editing ? `
          <div class="profile-edit">
            <div class="field"><label for="pf-name">角色名称<span class="req" aria-hidden="true">*</span></label><input id="pf-name" class="input" data-k="pf-name" data-profile="name" value="${esc(S.draft.name)}" autocomplete="off"></div>
            <div class="field"><label for="pf-desc">角色说明</label><textarea id="pf-desc" class="input" rows="2" data-k="pf-desc" data-profile="desc">${esc(S.draft.desc)}</textarea></div>
          </div>` : `
          <h1>${esc(shown.name)}<span class="pill pill-neutral">${r.kind === 'preset' ? '预置角色' : '自定义角色'}</span>${pill(STATUS[r.status])}</h1>
          <p class="pagehead-desc">${esc(shown.desc) || '<span class="hint">未填写角色说明</span>'}</p>`}
          <div class="pagehead-meta"><span>版本 <b>v${r.version}</b></span><span><b>${esc(shown.by)}</b> 更新于 <b class="mono">${esc(shown.at)}</b></span><span>已授权 <b>${active}</b> 人</span>${scope}</div>
        </div>
        <div class="pagehead-actions">
          ${ed ? btn('btn-ghost', 'edit-profile', S.editing ? '完成编辑' : '编辑资料', 'data-k="edit-profile"') : ''}
          ${ed && !dirty && r.status === 'draft' && !S.editing ? btn('btn-primary', 'publish', '保存并启用', 'data-k="publish"') : ''}
          ${btn('btn-ghost', 'back', icon('ArrowLeft', 14) + '返回列表', 'data-k="back"')}
        </div>
      </div>
      <div class="tabs" role="tablist" aria-label="角色详情分区">
        <button type="button" class="tab" role="tab" aria-selected="${S.tab === 'perm'}" data-act="tab" id="tab-perm" data-tab="perm" data-k="tab-perm">权限${dirty ? '<span class="tab-dot" role="img" aria-label="有未保存的更改"></span>' : ''}</button>
        <button type="button" class="tab" role="tab" aria-selected="${S.tab === 'members'}" data-act="tab" id="tab-members" data-tab="members" data-k="tab-members">已授权成员<span class="tab-count">${r.members.length}</span></button>
      </div>
    </div>
    <div class="content" id="content">
      <div class="content-body${dirty ? ' has-bar' : ''}">
        ${note}
        <div id="tab-body" role="tabpanel" aria-labelledby="tab-${S.tab}">${S.tab === 'perm' ? permTab(r) : membersTab(r)}</div>
      </div>
      <div id="bar-zone">${dirty ? (S.showChanges ? changesPanel(r) : '') + changebar(r) : ''}</div>
    </div>`;
  syncIndeterminate(view);
}

/* ── 权限页签：页面与操作 + 敏感字段 ── */
function permTab(r) {
  const ed = canEdit(r), perms = ed ? S.draft.perms : r.perms, st = stats(perms);
  return `
    <section class="card" aria-labelledby="h-perm">
      <div class="card-head">
        <div class="card-title"><h2 id="h-perm">页面与操作</h2><span class="card-sub">已开放 <b>${st.open}</b> / ${st.total} 个页面，可执行 <b>${st.acts}</b> 项操作，其中 <b>${st.risk}</b> 项为高危</span></div>
        <div class="card-tools">
          <div class="search" style="width:212px">${icon('Search', 14)}<input class="input" type="search" placeholder="搜索页面或操作" aria-label="搜索页面或操作" data-k="q" id="perm-q" value="${esc(S.q)}"${S.q ? ` data-clear="1"` : ''}></div>
          ${ed ? btn('btn-ghost btn-sm', 'all', '全选', 'data-k="all"') + btn('btn-ghost btn-sm', 'none', '清空', 'data-k="none"') : ''}
        </div>
      </div>
      <div id="perm-tree">${permTree(r, perms)}</div>
    </section>
    <section class="card" aria-labelledby="h-field">
      <div class="card-head">
        <div class="card-title"><h2 id="h-field">敏感字段</h2><span class="card-sub">持有该角色的成员在这些字段上看到的内容；同时持有多个角色时从严生效</span></div>
        <span class="card-sub">${fieldSummary(ed ? S.draft.fields : r.fields)}</span>
      </div>
      <div class="sfield sfield-top" aria-hidden="true"><span>字段</span><span>成员看到的内容</span><span>策略</span></div>
      ${FIELDS.map(f => fieldRow(f, (ed ? S.draft.fields : r.fields)[f.key] || 'visible', ed)).join('')}
    </section>`;
}
const fieldSummary = fields => {
  const n = k => FIELDS.filter(f => (fields[f.key] || 'visible') === k).length;
  return n('mask') + n('hidden') === 0 ? '全部可见' : `脱敏 ${n('mask')} 项 · 隐藏 ${n('hidden')} 项`;
};
function fieldRow(f, policy, ed) {
  const shown = policy === 'visible' ? '原样显示' : policy === 'mask' ? f.mask : '不显示该字段';
  return `
    <div class="sfield">
      <div><div class="sfield-name">${esc(f.name)}</div><div class="sfield-desc">${esc(f.where)}</div></div>
      <div class="sfield-view"><span class="hint">成员看到</span><code>${esc(shown)}</code></div>
      <div>${ed ? `
        <div class="seg" role="group" aria-label="${esc(f.name)} 的显示策略">${['visible', 'mask', 'hidden'].map(k => `<button type="button" aria-pressed="${policy === k}" data-act="field" data-field="${f.key}" data-policy="${k}" data-k="f-${f.key}-${k}">${POLICY[k]}</button>`).join('')}</div>`
        : policy === 'visible' ? '<span class="hint">可见</span>'
          : `<span class="pill ${policy === 'mask' ? 'pill-brand' : 'pill-neutral'}">${icon(policy === 'mask' ? 'Eye' : 'Lock', 13)}${POLICY[policy]}</span>`}
      </div>
    </div>`;
}

function permTree(r, perms) {
  const T = r.tenant, ed = canEdit(r);
  const q = S.q.trim();
  const match = p => !q || nameOf(p.id, T).includes(q) || p.acts.some(a => a.label.includes(q));
  const denied = [], parts = [];
  groupsFor(T).forEach((g, gi) => {
    const has = p => (perms[p.id] || []).length > 0;
    const full = p => p.acts.length === (perms[p.id] || []).length;
    if (g.pages.length === 1) {
      /* 单页面分组（业务工作台、业务搭建中心）：直接作为顶层页面行，不再套一层同名分组标题 */
      const p = g.pages[0];
      if (match(p) && (ed || has(p) || q)) parts.push(pageRow(p, perms[p.id] || [], ed, T, g.icon, g.other));
      else if (!ed && !q) denied.push(p);
      return;
    }
    const pages = g.pages.filter(p => match(p) && (ed || q || has(p)));
    if (!pages.length) { if (!ed && !q) denied.push(...g.pages); return; }
    if (!ed && !q) denied.push(...g.pages.filter(p => !has(p)));
    const gOpen = g.pages.filter(has).length, gFull = g.pages.filter(full).length;
    const all = gFull === g.pages.length;
    const ind = ed && gOpen > 0 && !all;
    parts.push(`
      <div class="group-head">
        ${ed ? `<input type="checkbox" class="cb" data-act="group" data-group="${gi}" data-k="g-${gi}" data-ind="${ind ? 1 : 0}" aria-label="全选「${esc(g.name)}」下所有页面与操作"${all ? ' checked' : ''}>` : '<span></span>'}
        <span class="group-name">${icon(g.icon, 16)}${esc(g.name)}${g.other ? '<span class="card-sub">不在左侧菜单中</span>' : ''}</span>
        <span class="group-count"><b>${ed ? gFull : gOpen}</b> / ${g.pages.length}${ed ? ' 已全选' : ''}</span>
      </div>`);
    pages.forEach(p => parts.push(pageRow(p, perms[p.id] || [], ed, T)));
  });
  let html = `<div class="legend"><span>${ed ? '勾选页面即「查看页面」；勾选任一操作会自动包含查看' : '标签为该角色可执行的操作；未列出的操作不可用'}</span><span><span class="risk-txt">${icon('TriangleAlert', 13)}高危操作</span>全程写入审计日志，授予成员时须填写原因</span></div>`;
  html += parts.length ? parts.join('') : `<div class="empty">${icon('Search', 32)}<h3>没有匹配的页面或操作</h3><p>换个关键词试试，例如页面名称「任务执行」或操作名称「导出」。</p></div>`;
  if (!ed && denied.length) {
    html += `<div class="denied">
      <button type="button" class="denied-summary" aria-expanded="${S.showDenied}" data-act="denied" data-k="denied">${icon(S.showDenied ? 'ChevronDown' : 'ChevronRight', 14)}未开放 ${denied.length} 个页面<span class="hint">${S.showDenied ? '收起' : '展开查看'}</span></button>
      ${S.showDenied ? `<div class="denied-list">${denied.map(p => `<span class="tag tag-muted">${esc(nameOf(p.id, T))}</span>`).join('')}</div>` : ''}
    </div>`;
  }
  return html;
}
function pageRow(p, ks, ed, T, soloIcon, other) {
  const on = ks.length > 0;
  const name = nameOf(p.id, T);
  let acts;
  if (ed) {
    acts = p.acts.filter(a => a.key !== 'view').map(a => {
      const checked = ks.includes(a.key);
      return `<button type="button" class="act${a.risk ? ' act-risk' : ''}" aria-pressed="${checked}" data-act="toggle-act" data-page="${p.id}" data-key="${a.key}" data-k="a-${p.id}-${a.key}" title="${a.risk ? '高危操作：' : ''}${esc(a.label)}">${icon('Check', 13, 'on-check')}${icon(a.risk ? 'TriangleAlert' : 'Circle', 13, a.risk ? 'off-risk' : 'off-dot')}${esc(a.label)}</button>`;
    }).join('');
    if (!acts) acts = on ? '<span class="row-void">仅查看</span>' : '';
  } else {
    const granted = p.acts.filter(a => ks.includes(a.key) && a.key !== 'view');
    acts = !on ? '<span class="tag tag-muted">未开放</span>'
      : !granted.length ? `<span class="tag tag-muted">${esc(p.acts.length === 1 ? p.acts[0].label : '仅查看')}</span>`
        : granted.map(a => `<span class="tag${a.risk ? ' tag-risk' : ''}">${a.risk ? icon('TriangleAlert', 12) : ''}${esc(a.label)}</span>`).join('');
  }
  const mark = ed
    ? `<label class="row-cb"><input type="checkbox" class="cb" data-act="toggle-page" data-page="${p.id}" data-k="p-${p.id}" aria-label="访问「${esc(name)}」"${on ? ' checked' : ''}></label>`
    : `<span class="row-cb ${on ? 'view-on' : 'view-off'}" role="img" aria-label="${on ? '已开放' : '未开放'}">${icon(on ? 'CircleCheck' : 'CircleDashed', 16)}</span>`;
  return `
    <div class="row${soloIcon ? ' solo' : ''}">
      ${mark}
      ${soloIcon ? `<span class="row-icon">${icon(soloIcon, 16)}</span>` : ''}
      <span class="row-name" title="${esc(p.tip)}">${esc(name)}${other && !ed ? '<span class="card-sub"> · 不在左侧菜单中</span>' : ''}</span>
      <div class="row-acts">${acts}</div>
    </div>`;
}
function syncIndeterminate(root) { root.querySelectorAll('input[data-ind="1"]').forEach(el => { el.indeterminate = true; }); }

/* ── 成员页签 ── */
function membersTab(r) {
  const enabled = r.status === 'enabled';
  const n = k => r.members.filter(m => m.status === k).length;
  return `
    <section class="card" aria-labelledby="h-members">
      <div class="card-head">
        <div class="card-title"><h2 id="h-members">已授权成员</h2><span class="card-sub">共 ${r.members.length} 人 · 生效 ${n('active')} · 已过期 ${n('expired')} · 已回收 ${n('revoked')}</span></div>
        <div class="card-tools">
          <div class="search" style="width:212px">${icon('Search', 14)}<input class="input" type="search" placeholder="搜索姓名或手机号" aria-label="搜索成员" data-k="mq" id="member-q" value="${esc(S.mq)}"></div>
          <select class="select" data-bind="mstatus" data-k="mstatus" aria-label="按授权状态筛选" data-active="${!!S.mstatus}">
            <option value="">全部状态</option><option value="active"${S.mstatus === 'active' ? ' selected' : ''}>生效</option><option value="expired"${S.mstatus === 'expired' ? ' selected' : ''}>已过期</option><option value="revoked"${S.mstatus === 'revoked' ? ' selected' : ''}>已回收</option>
          </select>
          ${enabled ? btn('btn-primary', 'grant', icon('UserPlus', 15) + '授予成员', 'data-k="grant"') : ''}
        </div>
      </div>
      <div id="members-table">${membersTable(r)}</div>
    </section>`;
}
function membersTable(r) {
  const T = r.tenant, enabled = r.status === 'enabled', order = { active: 0, expired: 1, revoked: 2 };
  const kw = S.mq.trim();
  const list = r.members.filter(m => {
    const u = people(T)[m.who];
    if (S.mstatus && m.status !== S.mstatus) return false;
    if (kw && !(u.name.includes(kw) || u.phone.includes(kw) || u.dept.includes(kw))) return false;
    return true;
  }).sort((a, b) => order[a.status] - order[b.status]);
  if (!list.length) {
    const filtered = kw || S.mstatus;
    return `<div class="empty">${icon(filtered ? 'Search' : 'Users', 36)}<h3>${filtered ? '没有符合条件的成员' : r.members.length ? '该状态下没有成员' : '还没有成员持有这个角色'}</h3><p>${filtered ? '换个关键词，或把授权状态切回「全部状态」。' : enabled ? '授予后立即生效，没有待复核环节。' : r.status === 'draft' ? '草稿角色启用后才能授予成员。' : '角色已停用，暂不可新增授予。'}</p>${filtered ? btn('btn-outline', 'member-reset', '清除筛选', 'data-k="member-reset"') : enabled && !r.members.length ? btn('btn-primary', 'grant', icon('UserPlus', 15) + '授予成员', 'data-k="grant-empty"') : ''}</div>`;
  }
  const head = T === 'pharma' ? ['成员', '部门 / 岗位', '负责区域', '生效期', '状态', '操作'] : ['成员', '部门 / 岗位', '组织范围', '业务范围', '生效期', '状态', '操作'];
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr>${head.map(h => `<th scope="col"${h === '操作' ? ' class="num"' : ''}>${h}</th>`).join('')}</tr></thead><tbody>
    ${list.map(m => {
      const u = people(T)[m.who], live = m.status === 'active';
      const period = m.status === 'revoked' ? `${m.from} 起` : `${m.from} ${m.to ? '至 ' + m.to : '起长期'}`;
      const sub = m.status === 'revoked' ? `已回收${m.reason ? '：' + esc(m.reason) : ''}` : `${esc(m.by)} 授予`;
      const region = u.regions || '未配置';
      const scope = m.scope ? ORG_SCOPE[m.scope] : r.id === 'provider-admin' ? ORG_SCOPE.PROVIDER : ORG_SCOPE.DEPT_AND_CHILD;
      const biz = r.id === 'provider-admin' ? '全服务商（管理员）' : m.biz === 'custom' ? `个人指定 ${(m.scopes || []).length} 家药厂` : `继承部门（${esc(u.dept)}）`;
      return `<tr${live ? '' : ' class="row-off"'}>
        <td class="cell-person"><b>${esc(u.name)}</b><span class="mono">${esc(u.phone)}</span></td>
        <td>${esc(u.dept)}${u.job ? `<div class="cell-sub">${esc(u.job)}</div>` : ''}${m.extra.length ? `<div class="cell-sub">例外：${esc(m.extra.join("、"))}</div>` : ""}</td>
        ${T === 'pharma' ? `<td>${esc(region)}</td>` : `<td>${esc(u.dept === '东方恒业推广有限公司' ? '本服务商全部' : scope)}</td><td>${esc(biz)}</td>`}
        <td><span class="mono">${period}</span><div class="cell-sub">${sub}</div></td>
        <td>${pill(GRANT[m.status])}</td>
        <td><div class="cell-ops">${live && enabled ? btn('btn-soft btn-sm', 'adjust', '调整范围', `data-id="${m.id}" data-k="adj-${m.id}"`) + btn('btn-quiet-danger btn-sm', 'revoke', '回收', `data-id="${m.id}" data-k="rv-${m.id}"`) : ''}</div></td>
      </tr>`;
    }).join('')}
  </tbody></table></div>`;
}

/* ── 未保存更改：变更清单 + 常驻更改栏 ── */
const CH_ICON = { add: ['Plus', 'ch-add'], del: ['Minus', 'ch-del'], info: ['Pencil', ''] };
function changesPanel(r) {
  const { list } = dirtyInfo(r);
  return `<section class="changes" aria-label="未保存的更改明细"><h3>本次更改（${list.length} 处，相对 v${r.version}）</h3><ul>
    ${list.map(c => `<li class="${CH_ICON[c.kind][1]}">${icon(CH_ICON[c.kind][0], 14)}<span>${esc(c.text)}</span></li>`).join('')}
  </ul></section>`;
}
function changebar(r) {
  const { list, add, del } = dirtyInfo(r);
  const saves = r.status === 'draft'
    ? btn('btn-outline', 'save-draft', '保存草稿', 'data-k="save-draft"') + btn('btn-primary', 'publish', '保存并启用', 'data-k="publish-bar"')
    : r.status === 'enabled' ? btn('btn-primary', 'save-changes', '保存更改', 'data-k="save-changes"')
      : btn('btn-primary', 'save-info', '保存资料', 'data-k="save-info"');
  const sum = [];
  if (add) sum.push(`新增 ${add} 项`); if (del) sum.push(`移除 ${del} 项`);
  const meta = list.length - (add || del ? list.filter(c => c.kind !== 'info').length : 0);
  if (meta > 0) sum.push(`资料与字段 ${meta} 处`);
  return `<div class="changebar" role="region" aria-label="未保存的更改">
    <div class="changebar-main"><span class="dot" aria-hidden="true"></span><b>有 ${list.length} 处未保存更改</b><span class="changebar-sum">${sum.join(' · ')}</span>
      ${btn('btn-ghost btn-sm', 'toggle-changes', S.showChanges ? '收起变更' : '查看变更', `aria-expanded="${S.showChanges}" data-k="toggle-changes"`)}</div>
    <div class="changebar-ops">${btn('btn-ghost', 'discard', '放弃更改', 'data-k="discard"')}${saves}</div>
  </div>`;
}


/* ═════════════════════ 局部刷新 ═════════════════════ */
const permsNow = () => (canEdit(role()) ? S.draft.perms : role().perms);
function refocus(root, key) { const el = key && root.querySelector('[data-k="' + key + '"]'); if (el) el.focus(); }
function rerenderView() {
  const r = role(), key = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.k : null;
  renderDetail();
  refocus(view, key);
}
function refreshDirty() {
  const r = role(), dirty = isDirty(r);
  $('#bar-zone').innerHTML = dirty ? (S.showChanges ? changesPanel(r) : '') + changebar(r) : '';
  $('.content-body').classList.toggle('has-bar', dirty);
  const tab = $('#tab-perm');
  if (tab) tab.innerHTML = '权限' + (dirty ? '<span class="tab-dot" role="img" aria-label="有未保存的更改"></span>' : '');
  const head = $('.pagehead-actions');
  if (head && S.draft) {
    const pub = $('[data-act="publish"]', head);
    const wantPub = !dirty && r.status === 'draft' && !S.editing;
    if (!pub && wantPub) head.insertAdjacentHTML('afterbegin', btn('btn-primary', 'publish', '保存并启用', 'data-k="publish"'));
    if (pub && !wantPub) pub.remove();
  }
}

/* ═════════════════════ 弹窗 ═════════════════════ */
const ACTOR = '沈悦';

  if (ROLES.some(x => x.tenant === r.tenant && x.id !== r.id && x.name === name)) { toast('err', '角色名称已存在', '本企业内角色名称必须唯一（含预置角色）。'); S.editing = true; rerenderView(); return false; }
  const affected = activeMembers(r).length, v = r.version + 1;

  Object.assign(r, { name, desc: d.desc.trim(), perms: clone(d.perms), fields: { ...d.fields }, version: v, by: ACTOR, at: nowStamp() });
  if (kind === 'publish' && wasDraft) r.status = 'enabled';
  const msg = kind === 'save-draft' ? ['草稿已保存', `「${name}」配置已保存（v${v}），仍为草稿状态；启用后才能授予成员。`]
    : kind === 'publish' ? ['已保存并启用', `「${name}」现为启用状态（v${v}），可以授予成员。`]
      : kind === 'save-changes' ? ['更改已保存并生效', affected ? `「${name}」已更新到 v${v}，对 ${affected} 名已授权成员即时生效。` : `「${name}」已更新到 v${v}；当前没有成员持有这个角色。`]
        : ['资料已保存，角色保持停用', `「${name}」已更新到 v${v}。重新启用请在角色列表中操作。`];
  openDraft(r);
  closeModal();
  render();
  toast('ok', msg[0], msg[1]);
  return true;
}

/* ═════════════════════ 提示 ═════════════════════ */
function toast(kind, title, desc) {
  const el = document.createElement('div');
  el.className = 'toast toast-' + (kind === 'ok' ? 'ok' : kind === 'err' ? 'err' : 'info');
  el.setAttribute('role', kind === 'err' ? 'alert' : 'status');
  el.innerHTML = icon(kind === 'ok' ? 'CircleCheck' : kind === 'err' ? 'CircleAlert' : 'Info', 18) + `<div><b>${esc(title)}</b>${desc ? `<p>${esc(desc)}</p>` : ''}</div><button type="button" class="icon-btn" aria-label="关闭提示">${icon('X', 14)}</button>`;
  $('#toasts').appendChild(el);
  const kill = () => el.remove();
  el.querySelector('button').addEventListener('click', kill);
  el.__t = setTimeout(kill, 5200);
  el.addEventListener('mouseenter', () => clearTimeout(el.__t));
  el.addEventListener('mouseleave', () => { el.__t = setTimeout(kill, 2600); });
}

/* ═════════════════════ 事件 ═════════════════════ */
const setMode = (m, el, part) => {
  const sc = m.scopes.find(s => s.id === el.dataset.id), cur = sc[part];
  if (cur === el.dataset.mode) return;
  sc[part] = el.dataset.mode;
  if (el.dataset.mode === 'pick') sc[part === 'vMode' ? 'v' : 'r'] = part === 'vMode' ? PHARMAS.find(p => p.id === sc.id).lines.map(l => l[0]) : [...new Set(PHARMAS.find(p => p.id === sc.id).lines.flatMap(l => l[1]))];
  else sc[part === 'vMode' ? 'v' : 'r'] = [];
  renderModal();
};
const toggleList = (m, el, key, prop) => { const sc = m.scopes.find(s => s.id === el.dataset.id); sc[prop] = sc[prop].includes(el.dataset[key]) ? sc[prop].filter(x => x !== el.dataset[key]) : [...sc[prop], el.dataset[key]]; renderModal(); };
const editScopeOf = (a, u) => ({ type: 'adjust', id: a.id, from: a.from, to: a.to || '', extraOpen: a.extra.length > 0, extra: [...a.extra], scopeMode: a.biz === 'custom' ? 'custom' : 'inherit', scopes: clone(a.scopes || []), reason: '', err: '' });

document.addEventListener('click', e => {
  const t = e.target;
  if (t.classList.contains('layer')) { if (S.modal && S.modal.type !== 'saveConfirm') closeModal(); return; }
  if (t.classList.contains('drawer-layer')) { closeNotes(); return; }
  const el = t.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act, r = role(), d = S.draft, m = S.modal, T = r.tenant;
  switch (act) {
    case 'close': closeModal(); break;
    case 'tab': if (S.tab !== el.dataset.tab) { S.tab = el.dataset.tab; rerenderView(); } break;
    case 'back': if (isDirty(r)) openModal({ type: 'discard', leave: true }, el); else { S.view = 'list'; render(); } break;
    case 'edit-profile':
      if (S.editing) { if (!d.name.trim()) { toast('err', '请填写角色名称', '角色名称不能为空。'); $('#pf-name').focus(); break; } S.editing = false; rerenderView(); }
      else { S.editing = true; rerenderView(); const i = $('#pf-name'); if (i) { i.focus(); i.select(); } }
      break;
    case 'publish': commitDraft('publish'); break;
    case 'toggle-page': { const id = el.dataset.page; if (el.checked) d.perms[id] = ['view']; else delete d.perms[id]; rerenderView(); break; }
    case 'toggle-act': { const id = el.dataset.page, set = new Set(d.perms[id] || []); if (set.has(el.dataset.key)) set.delete(el.dataset.key); else { set.add('view'); set.add(el.dataset.key); } const order = pageOf(id).acts.map(a => a.key).filter(x => set.has(x)); if (order.length) d.perms[id] = order; else delete d.perms[id]; rerenderView(); break; }
    case 'group': { const g = groupsFor(T)[+el.dataset.group]; g.pages.forEach(p => { if (el.checked) d.perms[p.id] = p.acts.map(a => a.key); else delete d.perms[p.id]; }); rerenderView(); break; }
    case 'all': groupsFor(T).forEach(g => g.pages.forEach(p => { d.perms[p.id] = p.acts.map(a => a.key); })); rerenderView(); break;
    case 'none': d.perms = { dashboard: ['view'] }; rerenderView(); break;
    case 'field': d.fields[el.dataset.field] = el.dataset.policy; rerenderView(); break;
    case 'denied': S.showDenied = !S.showDenied; rerenderView(); break;
    case 'grant': openModal(newGrant(), el); break;
    case 'member-reset': S.mq = ''; S.mstatus = ''; rerenderView(); break;
    case 'adjust': { const a = r.members.find(x => x.id === el.dataset.id); openModal(editScopeOf(a, people(T)[a.who]), el); break; }
    case 'revoke': openModal({ type: 'revoke', id: el.dataset.id, reason: '', err: '' }, el); break;
    case 'toggle-changes': S.showChanges = !S.showChanges; $('#bar-zone').innerHTML = (S.showChanges ? changesPanel(r) : '') + changebar(r); refocus(view, 'toggle-changes'); break;
    case 'discard': openModal({ type: 'discard', leave: false }, el); break;
    case 'save-draft': commitDraft('save-draft'); break;
    case 'save-info': commitDraft('save-info'); break;
    case 'save-changes': openModal({ type: 'saveConfirm' }, el); break;
    case 'save-ok': commitDraft('save-changes'); break;
    case 'discard-ok': { const leave = m.leave; openDraft(r); closeModal(); if (leave) S.view = 'list'; render(); toast('info', '已放弃未保存的更改', `「${r.name}」沿用 v${r.version} 的配置。`); break; }
    /* 弹窗内 */
    case 'sel-clear': m.sel = []; renderModal(); break;
    case 'sel-remove': m.sel = m.sel.filter(x => x !== el.dataset.id); renderModal(); break;
    case 'extra': { const x = el.dataset.dept; m.extra = m.extra.includes(x) ? m.extra.filter(y => y !== x) : [...m.extra, x]; renderModal(); break; }
    case 'pharma': m.scopes = m.scopes.some(s => s.id === el.dataset.id) ? m.scopes.filter(s => s.id !== el.dataset.id) : [...m.scopes, { id: el.dataset.id, vMode: 'all', v: [], rMode: 'all', r: [] }]; renderModal(); break;
    case 'vmode': setMode(m, el, 'vMode'); break;
    case 'rmode': setMode(m, el, 'rMode'); break;
    case 'vpick': toggleList(m, el, 'v', 'v'); break;
    case 'rpick': toggleList(m, el, 'r', 'r'); break;
    case 'create-ok': {
      const name = m.name.trim();
      const bad = !name ? '请填写角色名称' : ROLES.some(x => x.tenant === T && x.name === name) ? '本企业内角色名称必须唯一（含预置角色）' : '';
      if (bad) { m.err = bad; renderModal(); const i = $('#c-name'); if (i) { i.setAttribute('aria-invalid', 'true'); i.focus(); } break; }
      const nr = { id: 'r-' + Date.now(), tenant: T, kind: 'custom', status: 'draft', name, desc: m.desc.trim(), version: 1, by: ACTOR, at: nowStamp(), perms: {}, fields: {}, members: [] };

function writeHash() {

  if (S.modal) p.set('m', S.modal.type); if (S.notes) p.set('m', 'notes');
  const h = '#' + p.toString();
  if (location.hash !== h) history.replaceState(null, '', h);
}

}
function applyHash() {

  const rid = p.get('r');
  if (rid && ROLES.some(r => r.id === rid)) S.roleId = rid;
  openDraft(role());
  if (p.get('dirty') === '1') sampleDirty(role());
