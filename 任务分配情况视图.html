<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>任务分配情况</title>
  <style>
    :root{--blue:#2f80c6;--deep-blue:#275f91;--ink:#25343e;--muted:#76848d;--line:#e0e6ea;--soft:#f7f9fa;--green:#21875c;--orange:#bd7419;--shadow:0 24px 70px rgba(15,31,42,.28)}
    *{box-sizing:border-box} body{margin:0;min-width:1120px;min-height:100vh;background:rgba(22,35,45,.43);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}button{font:inherit}
    .modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(1120px,calc(100vw - 48px));height:min(720px,calc(100vh - 48px));background:#fff;border-radius:5px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden}
    .modal-head{height:52px;flex:none;padding:0 18px;background:linear-gradient(135deg,var(--blue),#2875b7);color:#fff;display:flex;align-items:center;justify-content:space-between}.modal-title{font-size:16px;font-weight:650}.close{width:30px;height:30px;border:0;background:transparent;color:#d9ebfa;font-size:25px;line-height:25px;cursor:pointer;border-radius:4px}.close:hover{background:rgba(255,255,255,.16);color:#fff}
    .stats{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border-bottom:1px solid var(--line)}.stat{background:#fff;text-align:center;padding:13px 10px 12px}.stat b{display:block;font:700 21px ui-monospace,SFMono-Regular,Menlo,monospace;color:#16776e;line-height:1.05}.stat span{display:block;margin-top:5px;color:var(--muted);font-size:12px}.stat.done b{color:var(--green)}.stat.undone b{color:var(--orange)}
    .view{flex:1;min-height:0;display:flex;flex-direction:column}.view-head{flex:none;padding:18px 20px 12px;display:flex;align-items:end;justify-content:space-between;gap:20px}.view-title{font-size:16px;color:#6873bd;font-weight:700}.view-desc{color:var(--muted);font-size:12px;margin-top:3px}.view-meta{color:var(--muted);font-size:12px}.view-body{flex:1;min-height:0;overflow:auto;padding:0 20px 18px}
    .table-wrap{border:1px solid var(--line);overflow:auto}.main-table{width:100%;min-width:940px;border-collapse:collapse}.main-table th{background:#f7f8f9;color:#56636d;font-size:12px;font-weight:650;text-align:left;white-space:nowrap;padding:11px 12px;border-bottom:1px solid var(--line)}.main-table td{padding:12px;border-bottom:1px solid #edf0f2;vertical-align:middle;color:#33424c}.main-table tr:last-child td{border-bottom:0}.main-table tr:hover td{background:#fbfdfd}.provider{font-weight:650;color:#263740}.workgroup{font-weight:650;color:#176f68}.region{color:#485862}.money{font:650 13px ui-monospace,SFMono-Regular,Menlo,monospace}
    .tag{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:3px 8px;font-size:11px;white-space:nowrap}.tag:before{content:"";width:5px;height:5px;border-radius:50%;background:currentColor}.tag.green{color:var(--green);background:#e8f6ee}.tag.orange{color:var(--orange);background:#fff3df}.tag.gray{color:#74818a;background:#eef1f3}.action{border:1px solid #9bc6e5;border-radius:3px;background:#eef7fd;color:#2179b8;padding:6px 10px;cursor:pointer;white-space:nowrap}.action:hover{background:#dff0fb;border-color:#5da7d5}
    .modal-footer{height:55px;flex:none;display:flex;justify-content:flex-end;align-items:center;padding:10px 20px;border-top:1px solid var(--line);background:#fff}.secondary{border:1px solid #d4dde2;background:#fff;color:#52616b;border-radius:4px;padding:7px 17px;cursor:pointer}.secondary:hover{border-color:#9db2bd;color:#263b45}
    .detail-table-wrap{margin-top:14px;border:1px solid var(--line);overflow:auto}.detail-table{width:100%;min-width:1260px;border-collapse:collapse;table-layout:fixed}.detail-table th,.detail-table td{border-right:1px solid var(--line);padding:9px 10px;text-align:center}.detail-table th:first-child,.detail-table td:first-child{text-align:left}.detail-table th:last-child,.detail-table td:last-child{border-right:0}.detail-table th{height:46px;background:#f7f8f9;color:#56636d;font-size:11px;line-height:1.25;white-space:normal}.detail-table td{height:70px;font-size:12px}.specialist-cell{display:flex;align-items:center;gap:8px}.avatar{width:28px;height:28px;border-radius:50%;background:#e8f1fb;color:#2d70a8;display:grid;place-items:center;font-size:11px;flex:none}.specialist-name{font-weight:650;white-space:nowrap}.ratio{font-weight:650;color:#32414a}.ratio.done{color:var(--green)}.ratio.pending{color:var(--orange)}.amount-cell{font:650 12px ui-monospace,SFMono-Regular,Menlo,monospace}.notice{margin-top:11px;color:#87939b;font-size:11px}.empty{text-align:center;padding:42px;color:var(--muted)}.hidden{display:none!important}
    @media(max-height:650px){.modal{height:calc(100vh - 24px)}.view-head{padding-top:12px}.view-body{padding-bottom:10px}}
  </style>
</head>
<body>
  <section class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="title">
    <header class="modal-head"><div class="modal-title" id="title">工作组分配情况</div><button class="close" onclick="closeModal()" aria-label="关闭">×</button></header>

    <section class="view" id="allocationView">
      <div class="view-head"><div><div class="view-title">任务分配视图</div><div class="view-desc">查看服务提供方、工作组、区域及任务金额，进入后查看个人明细。</div></div><div class="view-meta" id="relationCount"></div></div>
      <div class="view-body"><div class="table-wrap"><table class="main-table"><thead><tr><th style="width:22%">服务提供方</th><th style="width:20%">品种</th><th style="width:19%">工作组</th><th style="width:13%">区域</th><th style="width:14%">任务金额</th><th style="width:12%">操作</th></tr></thead><tbody id="groupRows"></tbody></table></div></div>
      <footer class="modal-footer"><button class="secondary" onclick="closeModal()">关闭</button></footer>
    </section>

    <section class="view hidden" id="detailView">
      <div class="view-head"><div><div class="view-title">服务专员明细视图</div><div class="view-desc">展示服务专员分配量、业务完成情况及绩效状态。</div></div></div>
      <div class="view-body"><div class="detail-table-wrap"><table class="detail-table"><colgroup><col style="width:190px"><col style="width:90px"><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:120px"><col style="width:120px"></colgroup><thead><tr><th>服务专员</th><th>总预算</th><th>已完成 / 医院拜访</th><th>医院拜访预算</th><th>已完成 / 商业拜访</th><th>商业拜访预算</th><th>已完成 / 药房拜访</th><th>药房拜访预算</th><th>绩效状态</th></tr></thead><tbody id="specialistRows"></tbody></table></div></div>
      <footer class="modal-footer"><button class="secondary" onclick="showAllocationView()">返回任务分配视图</button></footer>
    </section>
  </section>

  <script>
    const taskVariety = '阿托伐他汀钙片(20mg)';
    const groups = [
      {provider:'智联科技有限公司',name:'陕西一组',region:'陕西',amount:'￥21,000',people:[
        {name:'张伟',performance:'已打绩效',items:[['医院拜访','4 / 5','￥12,000'],['商业拜访','—','—'],['药房拜访','—','—']]},
        {name:'李强',performance:'未打绩效',items:[['医院拜访','2 / 3','￥6,000'],['商业拜访','1 / 2','￥3,000'],['药房拜访','—','—']]}
      ]},
      {provider:'智联科技有限公司',name:'陕西二组',region:'陕西',amount:'￥15,000',people:[
        {name:'王芳',performance:'已打绩效',items:[['医院拜访','2 / 4','￥8,000'],['商业拜访','—','—'],['药房拜访','—','—']]}
      ]},
      {provider:'康晟云服科技有限公司',name:'山东一组',region:'山东',amount:'￥38,000',people:[]},
      {provider:'东方恒业推广有限公司',name:'广东一组',region:'广东',amount:'￥45,000',people:[
        {name:'刘洋',performance:'已打绩效',items:[['医院拜访','3 / 4','￥8,000'],['商业拜访','2 / 2','￥6,000'],['药房拜访','1 / 2','￥4,000']]},
        {name:'陈静',performance:'已打绩效',items:[['医院拜访','2 / 3','￥6,000'],['商业拜访','1 / 2','￥3,000'],['药房拜访','1 / 2','￥4,000']]},
        {name:'杨明',performance:'未打绩效',items:[['医院拜访','1 / 2','￥4,000'],['商业拜访','1 / 2','￥3,000'],['药房拜访','—','—']]}
      ]}
    ];
    const tag = (label, color) => `<span class="tag ${color}">${label}</span>`;
    const formatMoney = value => `￥${Number(value).toLocaleString('zh-CN')}`;
    function renderGroups(){
      document.querySelector('#relationCount').textContent = `共 ${groups.length} 条分配关系`;
      document.querySelector('#groupRows').innerHTML = groups.map((group,index) => `<tr><td class="provider">${group.provider}</td><td>${taskVariety}</td><td><div class="workgroup">${group.name}</div></td><td class="region">${group.region}</td><td class="money">${group.amount}</td><td><button class="action" onclick="showDetail(${index})">查看工作组分配服务专员明细</button></td></tr>`).join('');
    }
    function showDetail(index){
      const people = groups[index].people;
      document.querySelector('#title').textContent = '服务专员明细'; document.querySelector('#allocationView').classList.add('hidden'); document.querySelector('#detailView').classList.remove('hidden');
      document.querySelector('#specialistRows').innerHTML = people.length ? people.map(person => `<tr><td><div class="specialist-cell"><span class="avatar">${person.name.slice(0,1)}</span><span class="specialist-name">${person.name}</span></div></td><td class="amount-cell">${formatMoney(person.items.reduce((sum,item) => sum + (item[2] === '—' ? 0 : Number(item[2].replace(/[￥,]/g,''))),0))}</td>${person.items.map((item,index) => `<td class="ratio ${item[1] === '—' ? '' : index === 0 ? 'done' : 'pending'}">${item[1]}</td><td class="amount-cell">${item[2]}</td>`).join('')}<td>${person.performance === '已打绩效' ? tag('已打绩效','green') : tag('未打绩效','orange')}</td></tr>`).join('') : `<tr><td colspan="9"><div class="empty">该工作组暂未分配服务专员</div></td></tr>`;
    }
    function showAllocationView(){ document.querySelector('#title').textContent='工作组分配情况'; document.querySelector('#detailView').classList.add('hidden'); document.querySelector('#allocationView').classList.remove('hidden'); }
    function closeModal(){ document.querySelector('#modal').classList.add('hidden'); }
    renderGroups();
    document.addEventListener('keydown',event=>{ if(event.key==='Escape'){ if(!document.querySelector('#detailView').classList.contains('hidden')) showAllocationView(); else closeModal(); } });
  </script>
</body>
</html>
